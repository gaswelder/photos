{{ if eq (len .Images) 1 }}
    <article class="model-single">
{{ else }}
    <article>
{{ end }}
        <h3>{{.Name}}</h3>
        <figure>
            <div class="folder">
            {{ range .Images }}
            <a href="../img/{{ . }}"><img src="img/{{ . }}" alt=""></a>
            {{ end }}
            </div>
            {{if .Desc}}<figcaption>{{.Desc}}</figcaption>{{end}}
        </figure>
    </article>
